models:

  - name: stg_transactions_enriched
    columns:
      - name: value
        data_tests:
          - assert_value_amount_positive:
              field: block_number

  - name: stg_token_transfers
    columns:
      - name: transaction_hash
        data_tests:
          - relationships:
              to: ref('stg_transactions')
              field: hash

  - name: stg_transactions
    description: "{{ doc('transactions') }}"
    columns:
      - name: hash
        tags: ['keys']
        description: >
          This is a very long multiline description about the unique
          identifier of each transaction in the Ethereum blockchain
        data_tests:
          - unique
          - not_null
          # - relationships:
          #     to: ref('stg_token_transfers')
          #     field: transaction_hash
          #     severity: warn
          #     config:
          #       store_failures: true
          #       store_failures_as: table
          #       where: date > current_date - 25

  - name: stablecoin_activity_per_day
    latest_version: 2

    config:
      contract:
        enforced: true
        alias_types: false

    columns:
      - name: date
        data_type: date
        description: ""

      - name: token_address
        data_type: string
        description: ""

      - name: type
        data_type: varchar
        description: ""
        data_tests:
          - accepted_values:
              values: ['Hybrid', 'Crypto-backed', 'Fiat-backed']

      - name: symbol
        data_type: varchar
        description: ""

      - name: total_usd_value
        data_type: float
        description: ""

    versions:
      - v: 1
        deprecation_date: 2030-01-01

      - v: 2
        columns:
          - include: all
            exclude: [token_address, symbol]


unit_tests:
  - name: test_is_valid_transaction_category_breakdown
    model: stg_transactions_enriched
    overrides:
      macros:
        # unit test this model in "full refresh" mode
        is_incremental: false 
    given:
      - input: ref('stg_transactions')
        rows:
          - {receipt_contract_address: 'bla'}

      - input: ref('stg_token_transfers')
        rows:
          - {transaction_hash: 'bla'}

    expect:
      rows:
        - {transaction_category: 'contract_creation'}

exposures:

  - name: eth_activity_per_day
    type: dashboard

    depends_on:
      - ref('stg_transactions_enriched')

    owner:
      name: Fabricio
      email: fabricio.quesadaramirez@gmail.com