name: 'eth'
version: '1.0.0'

profile: 'eth'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

flags:
  fail_fast: true

clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  +database: "seeds"
  +schema: "static"

models:
  eth:
    +materialized: table
    +tags: ['eth', 'crypto']

    marts:
      +tags:
        - powerbi
        - report
      +schema: marts

      analytics:
        stablecoin_activity_per_day:
          +post-hook:
            - "GRANT USAGE ON DATABASE DBT TO ROLE TESTER;"
            - "GRANT USAGE ON SCHEMA DBT.DBT_FAB_MARTS TO ROLE TESTER;"
            - "GRANT USAGE ON DATABASE DBT TO ROLE BA;"
            - "GRANT USAGE ON SCHEMA DBT.DBT_FAB_MARTS TO ROLE BA;"
            - "{{ create_latest_version_view() }}"
          +grants:
            select: ['BA']

vars:
  token_name_var: 'tron'
  token_address_var: '0x50327c6c5a14dcade707abad2e27eb517df87ab5'
  token_decimals_var: '6'

dispatch:
  - macro_namespace: dbt_utils
    search_order: ['eth', 'dbt_utils']